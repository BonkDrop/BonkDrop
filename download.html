<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="background-rotator.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="icon" href="favicon.ico" type="image/png">
  <title>BonkDrop 🔨 - télechargement</title>
</head>
<body class="site-page simple-page">

  <div class="site-background" aria-hidden="true">
    <div class="site-background-layer is-visible"></div>
    <div class="site-background-layer"></div>
  </div>

  <div class="overlay">
    <div class="page-shell">
      <main class="content simple-content">
        <p class="simple-kicker">Télechargement</p>
        <div class="brand-title-row">
          <a class="brand-inline-logo" href="index.html" aria-label="Accueil BonkDrop">
            <img src="logo_bonkdrop.png" alt="Logo BonkDrop">
          </a>
          <h1 class="title">BonkDrop 🔨</h1>
        </div>
        <p class="subtitle">Récuperation de votre fichier en cours.</p>
        <p id="status" class="status-line">Chargement...</p>
        <a id="downloadBtn" class="btn btn-primary page-action" hidden>Télecharger</a>
        <a class="secondary-link" href="/BonkDrop/">Retour à l'accueil</a>
      </main>
    </div>
  </div>

  <script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const status = document.getElementById("status");
  const btn = document.getElementById("downloadBtn");

  if (id) {
    const safeId = encodeURIComponent(id);
    const fileUrl = `https://api.bonkdrop.fr/file/${safeId}`;
    status.textContent = "Fichier pret";
    btn.href = fileUrl;
    btn.setAttribute("download", "");
    btn.target = "_blank";
    btn.hidden = false;
  } else {
    window.location.replace("/BonkDrop/liencasse.html");
  }
</script>

</body>
</html>
