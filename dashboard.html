<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">

<title>Dashboard - BonkDrop</title>
</head>
<body>

<div class="wrapper">

<div class="card">

    <div class="header">

        <div class="brand">
            <div class="logo"><img src="logo_bonkdrop.png" alt="Logo"></div>

            <div>
                <div class="title">Dashboard</div>
                <div class="subtitle">
                    Gérez tous vos uploads BonkDrop
                </div>
            </div>
        </div>

        <a href="index.html" class="back-btn">
            Nouvel upload
        </a>

    </div>

    <div class="storage">

        <div class="storage-top">
            <span class="storage-value">1.8 Go utilisés</span>
            <span class="storage-sub">35% du stockage</span>
        </div>

        <div class="progress">
            <div class="progress-fill"></div>
        </div>

    </div>

    <div class="files">

        <div class="file">

            <div class="file-icon">📷</div>

            <div class="file-info">
                <div class="file-name">vacances.jpg</div>
                <div class="file-meta">
                    3.4 MB • il y a 2 jours
                </div>
            </div>

            <div class="file-actions">
                <button class="icon-btn">⬇</button>
                <button class="icon-btn">🔗</button>
                <button class="icon-btn delete">🗑</button>
            </div>

        </div>

        <div class="file">

            <div class="file-icon">🎬</div>

            <div class="file-info">
                <div class="file-name">montage.mp4</div>
                <div class="file-meta">
                    124 MB • il y a 5 jours
                </div>
            </div>

            <div class="file-actions">
                <button class="icon-btn">⬇</button>
                <button class="icon-btn">🔗</button>
                <button class="icon-btn delete">🗑</button>
            </div>

        </div>

    </div>

</div>

</div>

</body>
</html>
