<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirection...</title>
</head>
<body>

  <p id="status">Recherche du lien...</p>

  <script>
    const SUPABASE_URL = "https://nyvwcggocbplisszqaju.supabase.co";
    const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55dndjZ2dvY2JwbGlzc3pxYWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNDAwMzMsImV4cCI6MjA4ODcxNjAzM30.Ly8uzFkvhFtyWm0Fwa4gM1B-W4MJwiodOM464xLj7Os";

    const path = window.location.pathname;
    const parts = path.split("/f/");

    if (parts.length > 1) {
      const id = parts[1].split("?")[0];

      fetch(`${SUPABASE_URL}/rest/v1/files?id=eq.${id}`, {
        headers: {
          "apikey": ANON_KEY,
          "Authorization": "Bearer " + ANON_KEY
        }
      })
      .then(res => res.json())
      .then(data => {
        if (data.length > 0) {
          // ✅ fichier existe
          window.location.replace(`/BonkDrop/download.html?id=${id}`);
        } else {
          // ❌ fichier existe pas
          window.location.replace("/BonkDrop/liencasse.html");
        }
      })
      .catch(() => {
        // ❌ erreur API
        window.location.replace("/BonkDrop/liencasse.html");
      });

    } else {
      // ❌ pas un lien /f/
      window.location.replace("/BonkDrop/liencasse.html");
    }
  </script>

</body>
