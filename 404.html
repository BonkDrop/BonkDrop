<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirection...</title>
</head>
<body>

  <p id="status">Recherche du lien...</p>

  <script>
    const path = window.location.pathname;
    const parts = path.split("/f/");

    if (parts.length > 1) {
      const id = parts[1].split("?")[0].trim();
      if (!id) {
        window.location.replace("/BonkDrop/liencasse.html");
      } else {
        window.location.replace(`/BonkDrop/download.html?id=${encodeURIComponent(id)}`);
      }
    } else {
      window.location.replace("/BonkDrop/liencasse.html");
    }
  </script>

</body>
</html>
